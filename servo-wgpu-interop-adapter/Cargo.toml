[package]
rust-version = "1.97.1"
name = "grafting-servo"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/wgpu-graft"
description = "Servo-specific offscreen rendering adapter built on grafting"

[lib]
name = "servo_wgpu_interop_adapter"

[features]
default = ["wgpu-29"]
# Select the wgpu version to match the host; forwarded to grafting.
# The newest enabled version takes precedence.
wgpu-30 = ["dep:wgpu_30", "grafting/wgpu-30"]
wgpu-29 = ["dep:wgpu_29", "grafting/wgpu-29"]
wgpu-28 = ["dep:wgpu_28", "grafting/wgpu-28"]
servo = ["dep:servo", "dep:accesskit", "dep:serde_json", "dep:tracing", "dep:url"]
# Forwarded to Servo for Windows builds that select ANGLE EGL instead of WGL.
no-wgl = ["servo", "servo/no-wgl"]

[dependencies]
euclid = "0.22.11"
gleam = "0.15.1"
# surfman and glow must match whatever the tracked Servo line pins, or the GL
# producer types (Surface/Connection/Context) fail to unify across the Servo
# RenderingContext boundary and every trait method reads as a type mismatch.
# Servo 0.8.0 (crates.io) uses surfman 0.14, gleam 0.15 and glow 0.17, read from
# its own manifests (servo-paint, servo-paint-api, servo-canvas-traits), unchanged
# from 0.7.0. Check them when bumping the line, not just that the lockfile
# resolves.
glow = "0.17.0"
image = "0.25.8"
rustls = "0.23.37"
url = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }
# Servo 0.8 pins accesskit 0.24 (with serde); the serde form carries updates to hosts on
# other accesskit versions.
accesskit = { version = "0.24.1", features = ["serde"], optional = true }
surfman = "0.14.0"
dpi = "0.1.2"
winit = "0.30.13"
wgpu_30 = { package = "wgpu", version = "30.0.1", features = ["metal"], optional = true }
wgpu_29 = { package = "wgpu", version = "29.0.1", features = ["metal"], optional = true }
wgpu_28 = { package = "wgpu", version = "28.0.0", features = ["metal"], optional = true }
grafting = { path = "../grafting", version = "0.6.0", default-features = false, features = ["surfman"] }
servo = { version = "0.8.0", optional = true }

[lints]
workspace = true
