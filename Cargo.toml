[workspace]
members = [
    "demo-support",
    "demo-raw-gl",
    "demo-servo-bevy",
    "demo-servo-blitz",
    "demo-servo-egui",
    "demo-servo-gpui",
    "demo-servo-slint",
    "demo-servo-winit",
    "demo-servo-xilem",
    "grafting",
    "grafting-frame",
    "servo-wgpu-interop-adapter",
]
# iced 0.15-dev pins web-sys exactly to 0.3.85 while wgpu 30.0.1 requires
# 0.3.104. Keep that wgpu-28 demo as a small adjacent workspace with its own
# lockfile so the core triplet can take wgpu 30 patch releases independently.
exclude = ["demo-servo-iced"]
resolver = "3"

# Lockfile invariant for the wgpu-30 Windows row: gpu-allocator 0.28 accepts
# any windows crate from 0.53 through 0.62, but wgpu-hal 30.0.1 uses 0.62 types
# in the same D3D12 calls. Keep gpu-allocator's Cargo.lock edge on windows
# 0.62.2; resolving that edge onto an older copy fails inside wgpu-hal with
# mismatched ID3D12Device / ID3D12Heap types. The Windows wgpu-30 CI row is the
# executable guard for this constraint.

# serde_fmt 1.1.0 adds `impl From<serde_fmt::Error> for std::fmt::Error`.
# On Rust 1.92 this creates an ambiguous `From` resolution in stylo's
# `ToCss` derive macro (E0282/E0283). The patch removes that impl.
#
# glslopt 0.1.12 (pulled by webrender) ships a bundled C11 threads polyfill
# whose `typedef pthread_once_t once_flag;` collides with glibc 2.34+'s own
# `once_flag` in <stdlib.h>. 0.1.14 adds `#ifndef __once_flag_defined`
# guards. Until webrender bumps glslopt, override here so Servo builds on
# Fedora 40+ / Ubuntu 24.04+.
#
# yeslogic-fontconfig-sys 6.0.0 emits EITHER root-level `extern "C"` blocks
# OR a runtime-loaded `Fc` struct depending on its `dlopen` feature. xilem's
# `fontique` enables the feature; `servo-fonts` requires the extern form. The
# patched copy emits both unconditionally so feature unification can't break
# either consumer.
#
# zed-font-kit still asks for freetype-sys 0.20 directly on Unix. Servo 0.5
# uses freetype-sys 0.23, and Cargo permits only one crate with
# `links = "freetype"` in the workspace graph. The small shim keeps font-kit's
# old package-version edge while re-exporting the 0.23 API backed by Servo's
# single native FreeType link.
[patch.crates-io]
freetype-sys = { path = "patches/freetype-sys-compat" }
serde_fmt = { path = "patches/serde_fmt" }
glslopt = { git = "https://github.com/jamienicol/glslopt-rs", rev = "68019f02a1437d785408ebc8ce7fd20341fffb8a" }
yeslogic-fontconfig-sys = { path = "patches/yeslogic-fontconfig-sys" }

[workspace.package]
rust-version = "1.97.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/wgpu-graft"
version = "0.1.0"
