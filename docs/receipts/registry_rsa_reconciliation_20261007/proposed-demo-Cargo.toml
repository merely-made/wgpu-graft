[package]
name = "demo-servo-winit"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Minimal winit + wgpu proof host for servo-wgpu-interop"

[dependencies]
demo-support = { path = "../demo-support" }
euclid = "0.22.11"
image = "0.25"
servo = { git = "https://github.com/servo/servo", rev = "1d44e5dd6a8b64c02f9dbf7fcbdf4ebdd0740019" }
pollster = "0.4.0"
rustls = "0.23.37"
servo-wgpu-interop-adapter = { path = "../adapter", features = ["servo"] }
url = "2.5.7"
wgpu = { version = "29.0.1", features = ["metal"] }
grafting = { version = "=0.6.0" }
winit = "0.30.13"

scrying = { version = "=0.7.2", default-features = false, features = ["wgpu-29"] }
welding = { version = "=0.14.1", default-features = false, features = ["wgpu-29"] }
pkcs1 = { version = "=0.8.0-rc.4", default-features = false }
