[package]
name = "demo-servo-slint"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Demo embedding Servo in a Slint UI, zero-copy via slint's unstable-wgpu Image::try_from"

[dependencies]
demo-support = { path = "../demo-support" }
euclid = "0.22.11"
# Slint 1.17 with the wgpu-29 integration (Image::try_from(wgpu::Texture)) and
# the femtovg-on-wgpu renderer. 1.16 only offered wgpu 28; 1.17 added
# unstable-wgpu-29, which lets this demo ride the workspace default instead of
# dragging a second wgpu major. The imported texture is slint's own
# wgpu::Texture type (Cargo unifies them).
slint = { version = "1.17", features = [
    "unstable-winit-030",
    "unstable-wgpu-29",
    "renderer-femtovg-wgpu",
] }
servo = { git = "https://github.com/servo/servo", branch = "release/v0.4" }
rustls = "0.23.37"
grafting = { path = "../grafting" }
servo-wgpu-interop-adapter = { path = "../servo-wgpu-interop-adapter", features = ["servo"] }
url = "2.5.7"
winit = "0.30.13"
