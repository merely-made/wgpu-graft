[package]
rust-version = "1.97.1"
name = "demo-servo-bevy"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Demo embedding Servo in a Bevy app, zero-copy via D3D12 shared-handle import into a GpuImage"

[dependencies]
demo-support = { path = "../demo-support" }
euclid = "0.22.11"
# Bevy 0.20 is on wgpu 30, so the adapter takes grafting's wgpu-30 row and the
# imported texture stays Bevy's own wgpu::Texture type.
bevy = { version = "0.20.1", default-features = false, features = [
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_sprite",
    # Bevy 0.19 split sprite drawing out of `bevy_sprite`: the SpriteRenderPlugin
    # (which actually renders sprites) lives behind `bevy_sprite_render`.
    "bevy_sprite_render",
    "bevy_window",
    "bevy_asset",
    "x11",
] }
servo = "0.8.0"
rustls = "0.23.37"
pollster = "0.4.0"
grafting = { path = "../grafting", default-features = false, features = ["surfman", "wgpu-30"] }
grafting-servo = { path = "../servo-wgpu-interop-adapter", default-features = false, features = ["servo", "wgpu-30"] }
url = "2.5.7"
winit = "0.30.13"
wgpu = { version = "30.0.1", features = ["metal"] }

[lints]
workspace = true
