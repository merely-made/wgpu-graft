name: Sync Servo Line

# The three branch syncs (main, latest-release, experimental) differ only in
# which Servo line they follow and which branch they push, so the body lives
# here once. The previous three copies each carried their own inline pin
# rewriter and their own hardcoded manifest list; the copies drifted, the lists
# never grew past the first five crates, and every scheduled run failed from
# May 2026 onward. See scripts/set_servo_pin.py for the failure in detail.

on:
  workflow_call:
    inputs:
      branch:
        description: Repository branch to update and push.
        required: true
        type: string
      line:
        description: >-
          Which Servo line to follow, as reported by scripts/servo_lines.py:
          `released` (newest tagged release line), `newest` (newest release
          branch, which may be untagged and still in flight), or `upstream`
          (tip of Servo's main).
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AWS_LC_SYS_NO_ASM: "1"

jobs:
  sync:
    name: Sync ${{ inputs.branch }} to Servo ${{ inputs.line }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sync-${{ inputs.line }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            sync-${{ inputs.line }}-
            sync-

      # Scheduled runs check out the default branch, and the next step switches
      # the working tree to the branch being synced. Copy the tooling out first
      # so every branch is synced by main's copy of it, rather than by whatever
      # stale copy that branch happens to carry.
      - name: Stage sync tooling
        run: cp scripts/servo_lines.py scripts/set_servo_pin.py "$RUNNER_TEMP/"

      - name: Resolve Servo release ladder
        id: servo
        run: python3 "$RUNNER_TEMP/servo_lines.py"

      - name: Switch to ${{ inputs.branch }}
        run: |
          git fetch origin '${{ inputs.branch }}'
          git checkout '${{ inputs.branch }}'
          git reset --hard 'origin/${{ inputs.branch }}'

      - name: Repin Servo
        id: repin
        env:
          RELEASED: ${{ steps.servo.outputs.released }}
          NEWEST: ${{ steps.servo.outputs.newest }}
          UPSTREAM: ${{ steps.servo.outputs.upstream }}
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          case "$LINE" in
            released) python3 "$RUNNER_TEMP/set_servo_pin.py" --branch "$RELEASED" ;;
            upstream) python3 "$RUNNER_TEMP/set_servo_pin.py" --rev "$UPSTREAM" ;;
            newest)
              # Equal lines mean upstream has not branched the next release
              # yet, so this branch has nothing to track that main does not.
              if [ "$NEWEST" = "$RELEASED" ]; then
                echo "Servo has not branched a line beyond $RELEASED; nothing to sync."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              python3 "$RUNNER_TEMP/set_servo_pin.py" --branch "$NEWEST"
              ;;
            *) echo "unknown line '$LINE'" >&2; exit 1 ;;
          esac

      # Deliberately not `cargo update`: that re-resolves every dependency to
      # its newest match and drags in unrelated breakage. Changing a manifest's
      # source is enough for cargo to re-resolve just that dependency and leave
      # the rest of the lockfile pinned where it is.
      #
      # This also decides whether the rest of the job is worth running. The
      # manifests alone cannot answer that: a branch-tracking pin is unchanged
      # text even when the branch it names has advanced, and the moved commit
      # shows up only in the lockfile. Resolving is cheap, compiling Servo is
      # not, so let the lockfile say whether anything actually moved.
      - name: Refresh lockfile
        id: refresh
        if: steps.repin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          if git diff --quiet; then
            echo "Manifests and lockfile already match the requested ref; nothing to build."
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      # Validation compiles Servo, which needs what mozangle needs on Linux.
      # The old sync workflows skipped this and would have failed here even
      # once their pin rewriting was fixed.
      - name: Install Servo build deps
        if: steps.repin.outputs.skip != 'true' && steps.refresh.outputs.unchanged != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config \
            libdbus-1-dev libfreetype6-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Validate adapter and reference demo
        if: steps.repin.outputs.skip != 'true' && steps.refresh.outputs.unchanged != 'true'
        run: |
          cargo check -p servo-wgpu-interop-adapter --features servo
          cargo check -p demo-servo-winit

      - name: Commit and push
        if: steps.repin.outputs.skip != 'true' && steps.refresh.outputs.unchanged != 'true'
        env:
          RELEASED: ${{ steps.servo.outputs.released }}
          NEWEST: ${{ steps.servo.outputs.newest }}
          UPSTREAM: ${{ steps.servo.outputs.upstream }}
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "${{ inputs.branch }} already tracks the requested Servo line."
            exit 0
          fi

          case "$LINE" in
            released) ref="$RELEASED" ;;
            newest) ref="$NEWEST" ;;
            upstream) ref="$UPSTREAM" ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ inputs.branch }}: track Servo $ref"
          git push origin '${{ inputs.branch }}'
