name: Sync Main To Servo Release

# main tracks the newest Servo line that has actually shipped a tag. Replaces
# the earlier "Sync Main To Servo LTS Release", which pulled main back to the
# v0.1.x LTS line that current adapter code cannot compile against.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/sync-servo-line.yml
    with:
      branch: main
      line: released
