name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Servo pulls aws-lc-rs which requires nasm on Windows; skip ASM on CI
  AWS_LC_SYS_NO_ASM: "1"
  # cargo's bundled libgit2 keeps failing to clone Servo's very large repo on
  # hosted runners, reporting "the SSL certificate is invalid" and "revision
  # ... not found" for a revision that exists. Every cargo command needs the
  # Servo source to resolve the workspace, so this took down the first step of
  # the Linux and Windows jobs before any code was compiled. Shelling out to
  # git is the same remedy the README gives for the identical failure locally.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  check-linux:
    name: Check and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --- Core library ---

      - name: cargo check (wgpu 28)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-28

      - name: cargo check (wgpu 29)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-29

      - name: cargo check (wgpu 30)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-30

      - name: cargo check (all features)
        run: cargo check --locked -p grafting --all-features

      - name: cargo test
        run: cargo test --locked -p grafting

      # Default features on Linux, which is how docs.rs builds this crate and
      # the only configuration where raw_gl, surfman_gl, and vulkan_dmabuf all
      # exist at once. Documenting with --no-default-features left intra-doc
      # links into those modules unresolvable, so this step failed on all three
      # platforms; the Linux job is now the one that checks docs.
      - name: cargo doc
        run: cargo doc --locked -p grafting --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # --- Raw GL demo (no Servo dependency, no native build deps) ---

      - name: cargo check demo-raw-gl
        run: cargo check --locked -p demo-raw-gl

      # --- Servo demos ---
      #
      # These require native build deps that mozangle (ANGLE) needs on Linux:
      #   clang, cmake, libssl-dev, pkg-config
      # These are required checks. The native dependency setup below is part of
      # the demo contract, so a demo regression must fail the workflow.

      - name: Install Servo build deps (Linux)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            clang cmake libssl-dev pkg-config \
            libdbus-1-dev libfreetype6-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: cargo check demo-servo-winit
        run: cargo check --locked -p demo-servo-winit

      - name: cargo check demo-servo-xilem
        run: cargo check --locked -p demo-servo-xilem

      - name: cargo check demo-servo-gpui
        run: cargo check --locked -p demo-servo-gpui

      - name: cargo check remaining cross-platform Servo demos
        run: >-
          cargo check --locked
          -p demo-servo-blitz
          -p demo-servo-egui
          -p demo-servo-slint

  # ── macOS ──────────────────────────────────────────────────────────────────
  check-macos:
    name: Check (macOS / Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --- Core library (Metal + IOSurface path) ---

      - name: cargo check (wgpu 28)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-28

      - name: cargo check (wgpu 29)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-29

      - name: cargo check (wgpu 30)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-30

      - name: cargo check (all features)
        run: cargo check --locked -p grafting --all-features

      - name: cargo test
        run: cargo test --locked -p grafting

      # --- Servo demos ---
      #
      # Servo on macOS requires cmake and pkg-config (via Homebrew). The demos
      # are required checks once those build dependencies are installed.

      - name: Install Servo build deps (macOS)
        run: brew install cmake pkg-config

      - name: cargo check demo-servo-winit
        run: cargo check --locked -p demo-servo-winit

      - name: cargo check demo-servo-xilem
        run: cargo check --locked -p demo-servo-xilem

      - name: cargo check demo-servo-gpui
        run: cargo check --locked -p demo-servo-gpui

      - name: cargo check remaining cross-platform Servo demos
        run: >-
          cargo check --locked
          -p demo-servo-blitz
          -p demo-servo-egui
          -p demo-servo-slint

  # ── Windows ────────────────────────────────────────────────────────────────
  check-windows-core:
    name: Check core (Windows / Vulkan + D3D)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      # Servo vendors the WPT suite, whose test262 filenames run past Windows'
      # 260-character path limit, so cargo's checkout of the Servo git
      # dependency dies with "path too long" before anything is compiled.
      # libgit2 honours core.longpaths, and this has to precede the cache step
      # because the restored ~/.cargo/git holds that same checkout.
      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --- Core library (Windows Vulkan + D3D11/D3D12 paths) ---

      - name: cargo check (wgpu 28)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-28

      - name: cargo check (wgpu 29)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-29

      - name: cargo check (wgpu 30)
        run: cargo check --locked -p grafting --no-default-features --features wgpu-30

      - name: cargo check (all features)
        run: cargo check --locked -p grafting --all-features

      - name: cargo test
        run: cargo test --locked -p grafting

      # --- Raw GL demo ---

      - name: cargo check demo-raw-gl
        run: cargo check --locked -p demo-raw-gl

  check-windows-servo:
    name: Check Servo demos (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # NASM is needed by aws-lc-sys on Windows even with NO_ASM=1 for some
      # codepaths; install it defensively.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          nasm --version

      # --- Servo demos ---
      #
      # Servo/mozangle on Windows requires clang and cmake.
      # LLVM is already present on windows-latest runners.

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: cargo check root-workspace Servo demos
        shell: pwsh
        run: ./scripts/check-servo-demos.ps1

  check-windows-iced:
    name: Check Iced Servo demo (Windows / DX12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Allow long paths
        run: git config --global core.longpaths true

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --version=2.16.3 --yes --no-progress
          nasm --version

      - name: Install cmake
        uses: lukka/get-cmake@latest

      # This demo deliberately exercises DX12 shared NT handles and is
      # therefore a Windows-only contract. Its independent workspace and
      # lockfile also make it a natural parallel CI lane.
      - name: cargo check demo-servo-iced
        run: cargo check --locked --manifest-path demo-servo-iced/Cargo.toml

  # Preserve one stable aggregate check while the expensive Windows graphs run
  # independently. This keeps the required-check surface simple and cuts wall
  # time without unifying Cargo graphs that deliberately carry different wgpu
  # and web-sys versions.
  check-windows:
    name: Check (Windows / Vulkan + D3D)
    if: ${{ always() }}
    needs:
      - check-windows-core
      - check-windows-servo
      - check-windows-iced
    runs-on: ubuntu-latest
    steps:
      - name: Verify Windows lanes
        run: |
          test "${{ needs.check-windows-core.result }}" = "success"
          test "${{ needs.check-windows-servo.result }}" = "success"
          test "${{ needs.check-windows-iced.result }}" = "success"
