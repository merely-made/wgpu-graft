name: hardware interop

# Real GPUs and real Servo demos on self-hosted machines. Over the sampled
# window this workflow completed green 11 times, was cancelled 5 times by its
# own concurrency group, and failed once — the cancellations tracked push
# cadence, not the code. It now runs weekly and on demand.
#
# Run it by hand before a release, or after touching an interop seam, with:
#   gh workflow run hardware-interop.yml
#
# Branch protection must NOT list these jobs as required checks.
on:
  schedule:
    # Staggered against the sibling hardware lanes so the four physical
    # machines are not contended: wgpu-weld headed 05:23 Sun and parity 07:23
    # Sun, wgpu-scry headed 09:23 Sun, this one 11:23 Sun.
    - cron: "23 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: -D warnings

jobs:
  radv-dmabuf:
    name: RADV DMA-BUF pixel round trips
    runs-on: [self-hosted, wgpu-hardware, radv, linux-x64]
    timeout-minutes: 150
    env:
      WGPU_BACKEND: vulkan
      CARGO_TARGET_DIR: /home/markik/Code/targets/wgpu-graft-hardware

    steps:
      - uses: actions/checkout@v7
      - name: Serialize host hardware use
        uses: ./.github/actions/host-hardware-lock
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Record the physical adapter
        run: |
          lspci -nn | grep -Ei 'vga|display|3d'
          cargo --version

      - name: Unit and descriptor-lifetime gates
        run: cargo test --locked -p grafting --no-default-features --features wgpu-30

      - name: RGBA and BGRA DMA-BUF pixel gates
        run: >-
          cargo test --locked -p grafting --no-default-features --features wgpu-30
          --test dmabuf_roundtrip -- --ignored --nocapture

  radv-servo-demo:
    name: RADV Servo imported-pixel, input, and resize gate
    runs-on: [self-hosted, wgpu-hardware, radv, wayland, headed]
    timeout-minutes: 165
    env:
      CARGO_TARGET_DIR: /home/markik/Code/targets/wgpu-graft-demo-hardware
      XDG_RUNTIME_DIR: /run/user/1000
      WAYLAND_DISPLAY: wayland-0
      DISPLAY: ""
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: GNOME
      WINIT_UNIX_BACKEND: wayland
      WGPU_BACKEND: vulkan

    steps:
      - uses: actions/checkout@v7
      - name: Serialize host hardware use
        uses: ./.github/actions/host-hardware-lock
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Assert the headed Wayland session
        run: |
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          test -z "${DISPLAY:-}"
      - name: Build the reference Servo demo
        run: cargo build --locked -p demo-servo-winit
      - name: Prove imported pixels, input, and resize
        run: |
          set -o pipefail
          timeout 90s "$CARGO_TARGET_DIR/debug/demo-servo-winit" --smoke 2>&1 | tee "$RUNNER_TEMP/graft-radv-demo.log"
          grep -F "GRAFT DEMO SMOKE PASS" "$RUNNER_TEMP/graft-radv-demo.log"

  nvidia-servo-demo:
    name: NVIDIA DX12 Servo imported-pixel, input, and resize gate
    runs-on: [self-hosted, wgpu-hardware, nvidia, windows-x64, headed]
    timeout-minutes: 170
    env:
      CARGO_TARGET_DIR: C:\Users\mark_\Code\targets\wgpu-graft-demo-hardware
      WGPU_BACKEND: dx12

    steps:
      - uses: actions/checkout@v7
      - name: Serialize host hardware use
        uses: ./.github/actions/host-hardware-lock
      - name: Record the physical adapter
        shell: powershell
        run: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      - name: Prove imported pixels, input, and resize
        shell: pwsh
        run: scripts/smoke-demo.ps1 -Seconds 120

  metal-m4-servo-demo:
    name: Apple M4 Servo imported-pixel, input, and resize gate
    runs-on: [self-hosted, wgpu-hardware, metal, macos-arm64, m4, headed]
    timeout-minutes: 170
    env:
      CARGO_TARGET_DIR: /Users/markik/Code/targets/wgpu-graft-demo-hardware
      WGPU_BACKEND: metal

    steps:
      - uses: actions/checkout@v7
      - name: Serialize host hardware use
        uses: ./.github/actions/host-hardware-lock
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install relocatable Python tooling
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/uv-tool-cache
        with:
          version: "0.12.8"
          enable-cache: false
      - name: Put Python 3.13 on PATH
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        run: |
          uv python install --no-bin 3.13
          python_bin="$(uv python find 3.13)"
          mkdir -p "$RUNNER_TEMP/python-bin"
          ln -sf "$python_bin" "$RUNNER_TEMP/python-bin/python"
          ln -sf "$python_bin" "$RUNNER_TEMP/python-bin/python3"
          echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
          echo "PYTHON=$python_bin" >> "$GITHUB_ENV"
          "$python_bin" --version
      - name: Build the reference Servo demo
        run: cargo build --locked -p demo-servo-winit
      - name: Prove imported pixels, input, and resize
        run: bash scripts/smoke-demo-mac.sh

  metal-intel-servo-demo:
    name: Intel iMac Servo imported-pixel, input, and resize gate
    runs-on: [self-hosted, wgpu-hardware, metal, macos-x64, intel-mac, headed]
    timeout-minutes: 170
    env:
      CARGO_TARGET_DIR: /Users/markik/Code/targets/wgpu-graft-demo-hardware
      WGPU_BACKEND: metal

    steps:
      - uses: actions/checkout@v7
      - name: Serialize host hardware use
        uses: ./.github/actions/host-hardware-lock
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install relocatable Python tooling
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/uv-tool-cache
        with:
          version: "0.12.8"
          enable-cache: false
      - name: Put Python 3.13 on PATH
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        run: |
          uv python install --no-bin 3.13
          python_bin="$(uv python find 3.13)"
          mkdir -p "$RUNNER_TEMP/python-bin"
          ln -sf "$python_bin" "$RUNNER_TEMP/python-bin/python"
          ln -sf "$python_bin" "$RUNNER_TEMP/python-bin/python3"
          echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
          echo "PYTHON=$python_bin" >> "$GITHUB_ENV"
          "$python_bin" --version
      - name: Build the reference Servo demo
        run: cargo build --locked -p demo-servo-winit
      - name: Prove imported pixels, input, and resize
        run: bash scripts/smoke-demo-mac.sh
