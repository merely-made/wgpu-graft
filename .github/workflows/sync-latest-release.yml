name: Sync Latest Release Branch

# latest-release tracks the newest Servo release branch, including one that is
# cut but not yet tagged, so the next line can be exercised ahead of its
# release. No-ops while upstream's newest branch is the one main already has.

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/sync-servo-line.yml
    with:
      branch: latest-release
      line: newest
