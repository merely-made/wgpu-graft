name: Experimental Servo Sync

# experimental tracks Servo's upstream main, pinned to an exact commit so a
# failing sync names the commit that broke it.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/sync-servo-line.yml
    with:
      branch: experimental
      line: upstream
