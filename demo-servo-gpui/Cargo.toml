[package]
rust-version = "1.97.1"
name = "demo-servo-gpui"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Demo embedding Servo in a GPUI application with URL bar and input forwarding"

[dependencies]
demo-support = { path = "../demo-support" }
euclid = "0.22.11"
# Zed's weekly GPUI snapshot, published as `gpui-pre`. Every `gpui-pre-*`
# crate pins its siblings `=0.3.10`, so the platform crate takes the same exact
# version. Aliased so the source keeps importing `gpui::...` and
# `gpui_platform::...`. wayland + x11 enable gpui's real Linux window backends.
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["font-kit", "windows-manifest", "wayland", "x11"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland", "x11"] }
image = "0.25"
servo = "0.8.0"
rustls = "0.23.37"
grafting-servo = { path = "../servo-wgpu-interop-adapter", features = ["servo"] }
smallvec = "1"
url = "2.5.7"
winit = "0.30.13"

[lints]
workspace = true
